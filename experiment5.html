<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiment 5</title>
  </head>
  <body>
      <form action="response.html" method="get">
        <center><h1>Student registration form</h1></center>
        <hr>
        <label for="fullname">Full Name: </label>
        <input type="text" placeholder="Enter your full name"><br><br>
        <label for="email">Email: </label>
        <input type="email" placeholder="Enter valid email address"><br><br>
        <label for="password">Password: </label>
        <input type="password" placeholder="Enter password"><br><br>
        <label for="gender">Gender: </label>
        <input type="radio">Male
        <input type="radio">Female
        <input type="radio">Other<br><br>
        <label for="course">Course: </label>
        <select>
            <option value="select course">select course</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select><br><br>
        <label for="contact">Contact No: </label>
        <input type="number" placeholder="Enter phone number"><br><br>
        <label for="address">Address: </label><br>
        <textarea placeholder="Enter your address"></textarea><br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
      </form><br>
      <hr>
      <center>&copy;2025 Student Registration Portal</center>

    
  </body>
</html>
